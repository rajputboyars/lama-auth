services:
  mongo:
    image: mongo:7
    container_name: paperbot-mongo
    restart: unless-stopped
    ports:
      - '${MONGO_HOST_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: paperbot-server
    restart: unless-stopped
    # MONGO_URI comes from .env: the bundled Mongo (mongodb://mongo:27017/paperbot)
    # or a hosted one such as MongoDB Atlas.
    env_file: .env
    environment:
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: paperbot-client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo-data:
