# Render Blueprint: the whole app as one service. The API (bot engine, REST API,
# live sockets) also serves the dashboard, so everything is at one URL.
# Only the database is separate (MongoDB Atlas). See README "Deploy online".
services:
  - type: web
    name: paper-trading-coach
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '1'
      - key: JWT_SECRET
        generateValue: true
      # MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster.mongodb.net/paperbot
      - key: MONGO_URI
        sync: false
      # bcrypt hash of the admin password (npm run hash-password -w server -- "your-password")
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_USERNAME
        value: admin
